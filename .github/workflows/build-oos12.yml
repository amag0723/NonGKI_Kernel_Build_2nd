name: oos12-s1e

# S1e 目标：B 槽无声卡/ADSP 的根本因是官方 OPLUS 树缺少「设备 OEM vendor」（22 个音频/平台 .ko +
# modules.load + init.target.rc 的 t≈5.4s 音频 early-init），且官方树自带音频驱动是错 OEM（OPPO 设备用 OPPO OEM .ko）。
# 路线：S1b 基座（官方 OPLUS 树 + 修 packed-union EXPORT_SYMBOL + CONFIG_MODVERSIONS=n + vermagic 欺骗含 modversions）
#      + 叠入设备 OEM vendor（ko/oem：22 .ko + modules.load + OEM init.target.rc）→ 设备自有 OEM .ko 在 OPLUS 内核上加载
#      + post-build 修补 Image 的 vermagic 串，使其含 modversions（匹配 OEM .ko vermagic）→ 加载时 vermagic 通过、
#      MODVERSIONS=n 跳过 CRC 校验 → 音频在 t≈5.4s 正常装载 → boot_adsp → ADSP 恢复。
#
# v1（2026-11-17）：S1e — 在 S1d workflow 上叠加：
#   1) 新增 step4e1：把本地 ko/oem（设备 OEM vendor）拷入 k/vendor/lib/modules 与 k/vendor/etc/init/hw
#      （官方 OPLUS k/vendor 无这两处，无冲突）。
#   2) step5 MODVERSIONS 从 =y 改为 =n（跳过 CRC 校验，让设备 OEM .ko 能加载）。
#   3) 原 step5b 改确认 MODVERSIONS=n；新增 step7a：post-build 修补 raw Image 的 vermagic 串
#      （MODVERSIONS=n 的内核 vermagic 缺 modversions → 补 "modversions"，使与设备 OEM .ko vermagic 一致）。
#   4) step7 收集 Image + kernel.config + build.log + build-tail + vermagic 修补标记。
on:
  push:
    branches: [ oos12 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: 0. 环境
        run: |
          echo "nproc=$(nproc)"; free -g | head -2; df -h / | tail -1
          git --version; python3 --version

      - name: 1. 依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev python3 zip unzip \
                                   binutils-aarch64-linux-gnu build-essential

      - name: 2. 克隆官方源码（内核 + vendor/techpack/DTS）
        run: |
          set -e
          B=oneplus/sm8150_s_12.1_op7pro
          git clone --depth=1 -b $B https://github.com/OnePlusOSS/android_kernel_oneplus_sm8150.git k
          git clone --depth=1 -b $B https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8150.git v
          mkdir -p k/vendor
          cp -a v/vendor/. k/vendor/
          echo "--- kernel HEAD ---"; git -C k log --oneline -1
          echo "--- vendor HEAD ---"; git -C v log --oneline -1
          echo "--- 关键目录 ---"
          ls -d k/vendor/qcom k/vendor/oplus k/techpack 2>&1
          ls k/arch/arm64/configs/vendor/sm8150-perf_defconfig
          echo "Kconfig source 总数: $(grep -rhcE '^\s*(r?source|osource)\s+' k --include=Kconfig | awk '{s+=$1}END{print s}')"
          du -sh k

      - name: 2b. 重定向 vendor symlink 到 k/vendor/（官方树指向 workspace 外）
        run: |
          python3 - <<'PYLINK'
          import os
          KV = os.path.abspath("k/vendor")
          relinked, broken = [], []

          def walk_links():
              for dp, dn, fn in os.walk("k"):
                  if ".git" in dp.split(os.sep):
                      continue
                  for f in list(fn) + list(dn):
                      p = os.path.join(dp, f)
                      if os.path.islink(p):
                          yield p

          for p in walk_links():
              t = os.readlink(p)
              if "vendor" not in t or t.startswith("/"):
                  continue
              i = t.find("vendor/")
              if i < 0:
                  continue
              sub = t[i+len("vendor/"):]
              p_abs = os.path.abspath(p)
              new = os.path.relpath(os.path.join(KV, sub), os.path.dirname(p_abs))
              try:
                  os.unlink(p)
                  os.symlink(new, p)
                  relinked.append((p, t, new))
              except Exception as e:
                  broken.append((p, str(e)))

          print("重定向 vendor symlink %d 个:" % len(relinked))
          for p, o, n in relinked[:40]:
              print("   %s : %s -> %s" % (p, o, n))
          if len(relinked) > 40:
              print("   ... 其余 %d 个省略" % (len(relinked) - 40))
          for p, e in broken:
              print("ERR relink %s : %s" % (p, e))

          still = [(p, os.readlink(p)) for p in walk_links()
                   if "vendor" in os.readlink(p) and not os.path.exists(p)]
          print("仍 broken 的 vendor symlink: %d（上游固有，多为无关 32bit defconfig，仅警告）" % len(still))
          for p, t in still[:20]:
              print("   BROKEN(warn) %s -> %s" % (p, t))
          if broken:
              for p, e in broken:
                  print("ERR relink %s : %s" % (p, e))
              raise SystemExit("ABORT: %d 个 symlink 重定向动作失败" % len(broken))

          key = "k/include/linux/sched_assist/sched_assist_mutex.h"
          print("sched_assist_mutex.h 可读:", os.path.isfile(key))
          if not os.path.isfile(key):
              raise SystemExit("ABORT: %s 仍不可读" % key)
          PYLINK

      - name: 3. 工具链（Proton-Clang）
        run: |
          set -e
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git tc
          ./tc/bin/clang --version | head -2
          ls tc/bin | grep -E '^(clang|ld.lld|llvm-ar)$'

      - name: 3b. as 分派器（Proton-Clang 自带 as 是 host x86，遇 -EL 直接报错）
        run: |
          python3 - <<'PYASW'
          import os, shutil
          cb = os.path.join(os.getcwd(), "tc", "bin")
          host_as = os.path.join(cb, "as")
          backup = os.path.join(cb, "as.host")
          if os.path.isfile(host_as) and not os.path.exists(backup):
              shutil.copy2(host_as, backup)
              script = (
                  "#!/bin/bash\n"
                  'HERE="$(cd "$(dirname "$0")" && pwd)"\n'
                  'for a in "$@"; do\n'
                  '  case "$a" in\n'
                  '    -EL|-EB)\n'
                  '      if [ -x "$HERE/aarch64-linux-gnu-as" ]; then exec "$HERE/aarch64-linux-gnu-as" "$@"; fi\n'
                  '      if [ -x /usr/bin/aarch64-linux-gnu-as ]; then exec /usr/bin/aarch64-linux-gnu-as "$@"; fi\n'
                  '      ;;\n'
                  '  esac\n'
                  'done\n'
                  'exec "$HERE/as.host" "$@"\n'
              )
              with open(host_as, "w", encoding="utf-8", newline="\n") as f:
                  f.write(script)
              os.chmod(host_as, 0o755)
              print("as dispatcher installed")
          else:
              print("as dispatcher skipped")
          print("system cross as:", os.path.exists("/usr/bin/aarch64-linux-gnu-as"))
          PYASW
          /usr/bin/aarch64-linux-gnu-as --version | head -1

      - name: 4. 完整性修复（精准版：base=内核根 k/，只注释确实缺失的静态 source）
        run: |
          python3 - <<'PYEOF'
          import os, re

          KR = "k"   # 内核源码根；Kconfig 的 source 路径相对它解析
          fixed_k, fixed_m, skipped = [], [], []

          def source_ok(rel):
              if rel.startswith("/") or "$" in rel or "(" in rel:
                  return True
              return os.path.exists(os.path.normpath(os.path.join(KR, rel)))

          for dp, dn, fn in os.walk(KR):
              if "/.git" in dp or dp.startswith(".git"):
                  continue
              if "Kconfig" not in fn:
                  continue
              p = os.path.join(dp, "Kconfig")
              try:
                  lines = open(p, encoding="utf-8", errors="replace").read().splitlines(True)
              except Exception:
                  continue
              out, hit = [], 0
              for ln in lines:
                  m = re.match(r'^(\s*)(source|rsource|osource)\s+(?:"([^"]+)"|(\S+))\s*$', ln)
                  if m:
                      rel = m.group(3) if m.group(3) is not None else m.group(4)
                      if not source_ok(rel):
                          out.append("# [S1FIX] " + ln); hit += 1
                          skipped.append(os.path.normpath(os.path.join(KR, rel)))
                          continue
                  out.append(ln)
              if hit:
                  open(p, "w", encoding="utf-8", newline="\n").write("".join(out))
                  fixed_k.append((p, hit))

          for dp, dn, fn in os.walk(KR):
              if "/.git" in dp or dp.startswith(".git"):
                  continue
              for f in ("Makefile", "Kbuild"):
                  if f not in fn:
                      continue
                  p = os.path.join(dp, f)
                  try:
                      lines = open(p, encoding="utf-8", errors="replace").read().splitlines(True)
                  except Exception:
                      continue
                  out, hit = [], 0
                  for ln in lines:
                      m = re.match(r'^(\s*)obj-y\s*\+?=\s*([A-Za-z0-9_./-]+)/\s*$', ln)
                      if m:
                          rel = os.path.relpath(dp, KR)
                          target = os.path.normpath(os.path.join(rel, m.group(2)))
                          if not os.path.isdir(os.path.join(KR, target)):
                              out.append("# [S1FIX] " + ln); hit += 1
                              skipped.append(os.path.join(KR, target))
                              continue
                      out.append(ln)
                  if hit:
                      open(p, "w", encoding="utf-8", newline="\n").write("".join(out))
                      fixed_m.append((p, hit))

          print("=== S1FIX Kconfig 改动 %d 文件, Makefile 改动 %d 文件 ===" % (len(fixed_k), len(fixed_m)))
          for p, n in fixed_k:
              print("   K %s (%d)" % (p, n))
          for p, n in fixed_m:
              print("   M %s (%d)" % (p, n))
          print("=== 缺失路径（去重 %d）===" % len(set(skipped)))
          for s in sorted(set(skipped)):
              print("   " + s)
          total_lines = sum(n for _, n in fixed_k)
          print("S1FIX_TOTAL_KCONFIG_LINES=%d" % total_lines)
          if total_lines > 400:
              raise SystemExit("ABORT: S1FIX 注释了 %d 行 Kconfig source，超过 400 行安全阈值，判定 base 逻辑有误" % total_lines)
          core = {os.path.normpath(os.path.join(KR, c)) for c in
                  ["arch/$SRCARCH/Kconfig", "init/Kconfig", "drivers/Kconfig", "fs/Kconfig",
                   "mm/Kconfig", "net/Kconfig", "kernel/Kconfig", "sound/Kconfig", "block/Kconfig"]}
          for s in skipped:
              if os.path.normpath(s) in core:
                  raise SystemExit("ABORT: S1FIX 注释了核心 Kconfig 入口 %s" % s)
          PYEOF

      - name: 4b. vendor 头文件（已由 step2b 的 symlink 重定向提供）
        run: |
          echo "vendor headers 由 step2b symlink 重定向到 k/vendor/ 提供，无需再 makedirs 覆盖"

      - name: 4c. camera 驱动（v11 起由 step5 关 CONFIG_SPECTRA_CAMERA 整体剔除）
        run: |
          echo "camera 驱动与 S1 的 ADSP/声卡验证无关，且是 vendor overlay 类型错误重灾区；已在 step5 关 CONFIG_SPECTRA_CAMERA 整体不编译"

      - name: 4d. OPLUS 硬编码 kernel/msm-4.14 路径兼容 symlink
        run: |
          python3 - <<'PYKP'
          import os
          d = "k/kernel"
          link = os.path.join(d, "msm-4.14")
          os.makedirs(d, exist_ok=True)
          if os.path.lexists(link):
              if os.path.islink(link):
                  os.unlink(link)
              else:
                  print("WARN: %s 已是实体目录，跳过" % link)
          if not os.path.lexists(link):
              os.symlink("..", link)
              print("created symlink", link, "-> ..")
          probe = os.path.normpath(os.path.join(
              "k/drivers/power/oplus/charger_ic",
              "../../../../kernel/msm-4.14/drivers/power/supply/qcom/storm-watch.h"))
          print("probe =", probe, "exists =", os.path.isfile(probe))
          if not os.path.isfile(probe):
              raise SystemExit("ABORT: kernel/msm-4.14 symlink 未修正硬编码路径")
          PYKP

      - name: 4e. S1d/S1e — 修 MODVERSIONS 的 packed-union EXPORT_SYMBOL（genksyms 无法生成 CRC）
        run: |
          python3 - <<'PYEXP'
          import os, re
          # MODVERSIONS=y 时 genksyms 对「按值传递 union __packed 参数」的函数无法生成 CRC，
          # 产生 __crc_<sym> 未定义 -> ld.lld: R_AARCH64_ABS32 relocation error。
          # 这类符号的调用方都是内核内建代码（CONFIG_IPA/GSI=y），EXPORT_SYMBOL 多余，
          # 注释掉即可：genksyms 不再生成 CRC 表项，内建链接照常解析。
          hits = []
          for dp, dn, fn in os.walk("k"):
              if ".git" in dp.split(os.sep) or "/out" in dp or dp.endswith("/out"):
                  continue
              for f in fn:
                  if not f.endswith((".c", ".h")):
                      continue
                  p = os.path.join(dp, f)
                  try:
                      src = open(p, encoding="utf-8", errors="replace").read()
                  except Exception:
                      continue
                  for m in re.finditer(r'EXPORT_SYMBOL(_GPL|_NS[^)]*)?\(\s*(\w+)\s*\)', src):
                      sym = m.group(2)
                      dm = re.search(r'\b' + re.escape(sym) + r'\s*\([^;{]*union\s+__packed[^;{]*\)\s*\{', src)
                      if dm:
                          hits.append((p, sym, m.group(0)))
          print("packed-union EXPORT_SYMBOL hits:", len(hits))
          for p, sym, exp in hits:
              print("  ", p, "->", sym)
              src = open(p, encoding="utf-8", errors="replace").read()
              src = src.replace(exp, "/* S1d/S1e disabled: " + exp + " */", 1)
              open(p, "w", encoding="utf-8").write(src)
          gsi = open("k/drivers/platform/msm/gsi/gsi.c", encoding="utf-8", errors="replace").read()
          if 'EXPORT_SYMBOL(gsi_write_channel_scratch);' in gsi and '/* S1d/S1e disabled: EXPORT_SYMBOL(gsi_write_channel_scratch); */' not in gsi:
              raise SystemExit("ABORT: gsi_write_channel_scratch export 未被注释")
          print("S1D/S1E_EXPORT_PATCH_OK")
          PYEXP

      - name: 4e1. S1e — 叠入设备 OEM vendor（oem.zip → k/vendor）
        run: |
          set -e
          # 确保 oem.zip 可用：先搜索仓库内任意位置（runner 检出可能缺 tools/pull 路径）；缺失则从 raw 分支 URL 下载到 /tmp（runner 必可写）
          found=0
          for cand in tools/pull/oem.zip ./oem.zip tools/oem.zip; do
            if [ -f "$cand" ]; then found=1; break; fi
          done
          if [ "$found" = 0 ]; then
            mkdir -p /tmp
            python3 -c "import urllib.request; urllib.request.urlretrieve('https://raw.githubusercontent.com/amag0723/NonGKI_Kernel_Build_2nd/oos12/tools/pull/oem.zip','/tmp/oem.zip')"
          fi
          [ -f /tmp/oem.zip ] || { echo "ABORT: /tmp/oem.zip 不可用（oem.zip 无法获取）"; exit 1; }
          # oem.zip 含设备 OEM vendor：lib/modules（22 .ko + modules.load 等）+ etc/init/hw/init.target.rc。
          # 官方 OPLUS k/vendor 无这两处，无冲突；un zip 后 CONFIG_MODULES 按 OEM modules.load 加载 .ko，
          # OEM init.target.rc 的 t≈5.4s 音频 early-init 在 S1 内核上执行。
          mkdir -p k/vendor/lib k/vendor/etc/init/hw
          rm -rf k/vendor/lib/modules k/vendor/etc/init/hw/init.target.rc
          unzip -q -o /tmp/oem.zip -d k/vendor
          echo "vendor/lib/modules .ko 数 = $(ls k/vendor/lib/modules/*.ko 2>/dev/null | wc -l)"
          echo "vendor/lib/modules/modules.load 存在 = $([ -f k/vendor/lib/modules/modules.load ] && echo yes || echo no)"
          echo "vendor/etc/init/hw/init.target.rc 存在 = $([ -f k/vendor/etc/init/hw/init.target.rc ] && echo yes || echo no)"
          # 自检：init.target.rc 含音频 early-init modprobe（device OEM 特有）
          grep -cE 'modprobe.*(audio|adsp|q6|aphor)' k/vendor/etc/init/hw/init.target.rc | xargs echo "init.target.rc 音频相关行数 ="
          wc -c k/vendor/lib/modules/modules.load | xargs echo "modules.load 大小 ="
          echo "S1E_OVERLAY_OK"

      - name: 5. defconfig + 关 camera + 硬门禁（MODVERSIONS=n）
        run: |
          set -e
          export PATH=$PWD/tc/bin:$PATH
          cd k
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- vendor/sm8150-perf_defconfig
          # 必需：关签名强制 / 关模块版本校验（CRC）/ camera 整体剔除；MODVERSIONS=n（跳过 CRC 校验，让设备 OEM .ko 能加载）
          scripts/config --file out/.config -d MODULE_SIG_FORCE -d SPECTRA_CAMERA -e MODVERSIONS \
              -d MODVERSIONS
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          # 归一为显式 =n：scripts/config -d 会把项置为「未启用」注释态（注释行形如 "# CONFIG_X is not set"），gate 要求显式 =n；此处统一覆盖为 =n
          sed -i 's/^[[:space:]]*[# ]*CONFIG_MODULE_SIG_FORCE is not set[[:space:]]*$/CONFIG_MODULE_SIG_FORCE=n/' out/.config
          sed -i 's/^[[:space:]]*CONFIG_MODULE_SIG_FORCE=y[[:space:]]*$/CONFIG_MODULE_SIG_FORCE=n/' out/.config
          sed -i 's/^[[:space:]]*[# ]*CONFIG_MODVERSIONS is not set[[:space:]]*$/CONFIG_MODVERSIONS=n/' out/.config
          sed -i 's/^[[:space:]]*CONFIG_MODVERSIONS=y[[:space:]]*$/CONFIG_MODVERSIONS=n/' out/.config
          echo "=== 配置核验 ==="
          N=$(grep -cE '^CONFIG_' out/.config || true)
          echo "CONFIG 行数 = $N"
          head -5 out/.config
          grep -E 'CONFIG_HZ=|CONFIG_MODULES=|CONFIG_MODULE_SIG_FORCE|CONFIG_MODVERSIONS' out/.config || true
          # 硬门禁：坏 config 立即失败
          test "$N" -ge 1000 || { echo "ABORT: .config 只有 $N 行 (<1000)，Kconfig 树仍被破坏"; exit 1; }
          grep -qE '^CONFIG_HZ=[0-9]+$' out/.config || { echo "ABORT: CONFIG_HZ 未定义，timeconst 会挂 bc"; exit 1; }
          grep -qE '^CONFIG_MODULES=y$' out/.config || { echo "ABORT: CONFIG_MODULES 未定义"; exit 1; }
          # S1e 特定：必须跳过 CRC（MODVERSIONS=n 或显式关闭均可，均为跳过 CRC，让设备 OEM .ko 能加载）
          grep -q '^CONFIG_MODVERSIONS=n$' out/.config \
            || grep -q '^# CONFIG_MODVERSIONS is not set' out/.config \
            || { echo "ABORT: S1e 需要跳过 CRC（MODVERSIONS=n 或关闭），实际="; grep '^CONFIG_MODVERSIONS' out/.config; exit 1; }
          grep -q '^CONFIG_MODULE_SIG_FORCE=n$' out/.config || { echo "ABORT: CONFIG_MODULE_SIG_FORCE 非 n"; exit 1; }

      - name: 5b. S1e — 确认真正的 MODVERSIONS=n（跳过 CRC 校验）
        run: |
          echo "S1e = 官方 OPLUS 树 + 设备 OEM vendor 叠载 + MODVERSIONS=n（跳过 CRC，让 OEM .ko 加载）"
          grep -E '^CONFIG_MODVERSIONS=' k/out/.config || { echo "ABORT: MODVERSIONS 项缺失"; exit 1; }
          grep -q '^CONFIG_MODVERSIONS=n$' k/out/.config \
            || grep -q '^# CONFIG_MODVERSIONS is not set' k/out/.config \
            || { echo "ABORT: MODVERSIONS 未设为 n（不是真跳过 CRC）"; exit 1; }
          grep -q '^CONFIG_MODULE_SIG_FORCE=n$' k/out/.config && echo "REAL_MODVERSIONS_N_OK"

      - name: 6. 编 Image（timeout + 行缓冲 + 关闭 stdin）
        run: |
          set -e -o pipefail
          export PATH=$PWD/tc/bin:$PATH
          cd k
          timeout 2400s stdbuf -oL -eL \
            make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld \
                 KCFLAGS="-Wno-error -Wno-strict-prototypes" -j$(nproc) Image </dev/null 2>&1 | tee ../build.log
          echo "=== 产物 ==="
          ls -la out/arch/arm64/boot/Image

      - name: 7a. S1e — post-build 修补 vermagic 串（含 modversions，匹配设备 OEM .ko）
        run: |
          set -e
          export PATH=$PWD/tc/bin:$PATH
          cd k
          img=out/arch/arm64/boot/Image
          if [ ! -f "$img" ]; then echo "ABORT: Image 不存在"; exit 1; fi
          # MODVERSIONS=n 的内核 vermagic 缺 "modversions"；设备 OEM .ko vermagic 含 modversions。
          # 修补 Image 内的 vermagic 串，将 "mod_unload aarch64" 改为 "mod_unload modversions aarch64"，
          # 使加载时 vermagic 与 OEM .ko 一致（MODVERSIONS=n 跳过 CRC，故不会因 CRC 被拒）。
          python3 - <<'PYFORGE'
          import re, os
          p = "out/arch/arm64/boot/Image"
          d = bytearray(open(p, "rb").read())
          before = d.count(b"mod_unload aarch64")
          # 在 Image 中查找 vermagic 串（含 mod_unload 上下文）
          pat = re.compile(rb"mod_unload[^\x00]*aarch64")
          hits = list(pat.finditer(bytes(d)))
          print("found vermagic-like %d" % len(hits))
          for m in hits[:5]:
              print("   at", m.start(), ":", m.group(0)[:80])
          if not hits:
              raise SystemExit("ABORT: 未找到 vermagic 串（mod_unload ... aarch64）")
          # 仅把不含 modversions 的，补 "modversions"
          for m in hits:
              s = bytes(d)[m.start():m.end()]
              if b"modversions" in s:
                  continue
              # 替换尾部 "aarch64" 为 "modversions aarch64"
              idx = s.rfind(b"aarch64")
              if idx < 0:
                  continue
              new = s[:idx] + b"modversions" + s[idx:]
              d = bytearray(d[:m.start()]) + bytearray(new) + bytearray(d[m.end():])
          open(p, "wb").write(d)
          after = d.count(b"mod_unload modversions aarch64")
          print("patched mod_unload aarch64 -> mod_unload modversions aarch64: %d (before %d, after %d)" % (before, before, after))
          if after == 0:
              raise SystemExit("ABORT: vermagic 修补后仍无 modversions aarch64")
          print("VERMAGIC_FORGE_OK")
          PYFORGE
          # 自检：Image 中现在应含 mod_unload modversions aarch64
          grep -aoE 'mod_unload modversions aarch64' out/arch/arm64/boot/Image | head -1 | xargs echo "Image vermagic vercheck:"
          ls -la out/arch/arm64/boot/Image

      - name: 7. 收集
        if: always()
        run: |
          cp k/out/arch/arm64/boot/Image ./Image 2>/dev/null || echo "NO_IMAGE"
          cp k/out/.config ./kernel.config 2>/dev/null || true
          tail -120 build.log > build-tail.log 2>/dev/null || true
          echo "=== config 行数 ==="; grep -cE '^CONFIG_' kernel.config 2>/dev/null || true
          echo "=== S1e MODVERSIONS=n + vermagic 验证 ==="
          grep -E '^CONFIG_MODVERSIONS=|^CONFIG_MODULE_SIG_FORCE=' kernel.config || true
          python3 - <<'PYEOF'
          import os, re
          if not os.path.isfile("Image"):
              print("NO_IMAGE, skip")
              raise SystemExit(0)
          d = open("Image", "rb").read()
          found = []
          for m in re.finditer(rb"4\.14\.180[^\x00\n]{0,90}", d):
              s = m.group(0).decode("ascii", "replace")
              if "mod_unload" in s and s not in found:
                  found.append(s)
          for s in found:
              print("KERNEL_VERMAGIC:", s)
          if not any("modversions" in s for s in found):
              raise SystemExit("ABORT: Image vermagic 不含 modversions")
          if not any("mod_unload modversions aarch64" in s for s in found):
              raise SystemExit("ABORT: Image vermagic 未修补含 modversions aarch64")
          print("S1E_MODVERSIONS_N_AND_VERMAGIC_OK")
          PYEOF
          ls -la . || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oos12-s1e
          path: |
            Image
            kernel.config
            build.log
            build-tail.log
          if-no-files-found: warn
