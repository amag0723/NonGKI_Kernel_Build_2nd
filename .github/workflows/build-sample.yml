name: Build OnePlus 7 Pro (OxygenOS 12) SukiSU-Ultra + SuSFS

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [sample]

# ============================================================================
# GM1910 / guacamole / sm8150 / kernel 4.14.180 (non-GKI) / OxygenOS 12
# All values below are derived from device measurements + the template's
# proven sm8150 (raphael, 4.14) and OnePlus-OOS (instantnoodle) workflows.
# Target repo branch: sample  (the sample branch carries its own matching
# ./.github/workflows/* composite actions, including patch-no-kprobe)
# ============================================================================
env:
  # ---- Device ----
  DEVICE_NAME : "oneplus_7_pro"
  DEVICE_CODENAME : "guacamole"

  CUSTOM_CMDS : "BRAND_SHOW_FLAG=oneplus CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld"

  # ---- OnePlus official kernel source, OOS12.1 / OnePlus 7 Pro branch ----
  KERNEL_SOURCE : "https://github.com/OnePlusOSS/android_kernel_oneplus_sm8150.git"
  KERNEL_BRANCH : "oneplus/sm8150_s_12.1_op7pro"

  # 4.14 does NOT build with LLVM 19. Proton-Clang is the proven toolchain
  # for sm8150 / 4.14 (used by the template's raphael K20 Pro workflow).
  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "master"

  GCC_GNU : false
  GCC_64_SOURCE : ""
  GCC_64_BRANCH : ""
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""

  DEFCONFIG_SOURCE : ""
  DEFCONFIG_NAME : "vendor/sm8150-perf_defconfig"
  DEFCONFIG_ORIGIN_IMAGE : ""
  DEFCONFIG_FROM_BOOT : false

  # ---- Root solution: SukiSU-Ultra ----
  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""
  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "sukisu"
  KERNELSU_METHOD : "shell"          # non-GKI; same as raphael / OP8 workflows

  # ---- Kernel-level hiding ----
  # OnePlus OSS trees carry a CONFIG_OPLUS_SECURE_GUARD block in fs/namespace.c
  # that upstream SUSFS patch v2.2.00 does not understand -> Hunk #1 rejects.
  # Every official OnePlus workflow enables SUSFS_FIXED with a per-device
  # susfs_fixed.patch; we do the same (guacamole_oos12/susfs_fixed.patch).
  # A non-empty SUSFS_PATCH_FIXED also makes the upstream rej guard skip its
  # hard `false` exit for the harmless fs/notify/fdinfo.c reject.
  SUSFS_ENABLE : true
  SUSFS_FIXED : true
  SUSFS_FOLDER_FIXED : "guacamole_oos12"
  SUSFS_PATCH_FIXED : "susfs_fixed"

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"
  BOOT_SOURCE : ""

  # guacamole has dtbo; the known "WiFi/sound lost" issue on this device is
  # related to kernel/vendor/dtbo mismatch, so keep dtbo in the package.
  NEED_DTBO : true
  NEED_SAFE_DTBO : false

  ROM_TEXT : "oxygenos12"

  PYTHON_VERSION : "3"
  PACK_METHOD : "AnyKernel3"
  PACK_KMODULES : "false"

  # Our fork carries the extra guacamole_oos12/susfs_fixed.patch on op_kernel.
  PATCHES_SOURCE : "amag0723/NonGKI_Kernel_Patches"
  PATCHES_BRANCH : "op_kernel"       # OnePlus kernel patch set

  REKERNEL_ENABLE : "false"
  DROIDSPACES_ENABLE : "false"
  NOMOUNT_ENABLE : "false"

  HOOK_METHOD : "syscall"

  # Keep the first build simple: KPM inline needs extra 4.14 backports.
  KPM_ENABLE : "false"
  KPM_INLINE : "false"
  KPM_KPATCH_NEXT : "false"
  KPM_PATCH_SOURCE : "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE : "false"
  BASEBAND_GUARD_BOOT : "false"

  GENERATE_DTB : "false"
  GENERATE_CHIP : "qcom"

  BUILD_DEBUGGER : "true"            # verbose output for the first attempt
  SKIP_PATCH : "false"

  BUILD_OTHER_CONFIG : "false"
  MERGE_CONFIG_FILES : "vendor/debugfs.config,vendor/lahaina_QGKI.config"

  FREE_MORE_SPACE : "false"

jobs:
  build-kernel:
    name: OnePlus 7 Pro OOS12 - SukiSU-Ultra + SuSFS
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: Get necessary tools
        uses: ./.github/workflows/build-ready

      # OnePlus splits the OOS12 kernel into TWO repositories:
      #   android_kernel_oneplus_sm8150                       (kernel core)
      #   android_kernel_modules_and_devicetree_oneplus_sm8150 (vendor/ tree)
      # The core tree contains symlinks such as
      #   block/oplus_foreground_io_opt -> ../../../vendor/oplus/kernel/...
      # Without the second repo, `make defconfig` dies with
      #   block/Kconfig:235: can't open file "block/oplus_foreground_io_opt/Kconfig"
      # Merge the official vendor tree, then re-point every dangling symlink
      # at the real directory inside device_kernel/vendor/.
      - name: Merge official OnePlus vendor tree
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 -b oneplus/sm8150_s_12.1_op7pro \
            https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8150.git vendor_src
          mkdir -p device_kernel/vendor
          cp -a vendor_src/vendor/. device_kernel/vendor/
          echo "[+] vendor tree merged: $(find device_kernel/vendor -type f | wc -l) files"
          python3 - <<'PYFIXLINKS'
          import os
          root = os.path.abspath("device_kernel")
          fixed, unresolved = [], []
          for dirpath, dirs, files in os.walk(root):
              if ".git" in dirpath:
                  continue
              for n in list(dirs) + list(files):
                  fp = os.path.join(dirpath, n)
                  if not os.path.islink(fp) or os.path.exists(fp):
                      continue
                  target = os.readlink(fp)
                  idx = target.find("vendor/")
                  if idx < 0:
                      unresolved.append((os.path.relpath(fp, root), target))
                      continue
                  cand = os.path.join(root, target[idx:])
                  if os.path.exists(cand):
                      os.remove(fp)
                      os.symlink(cand, fp)
                      fixed.append(os.path.relpath(fp, root))
                  else:
                      unresolved.append((os.path.relpath(fp, root), target))
          print("=== vendor merge: re-pointed dangling symlinks: %d ===" % len(fixed))
          for f in fixed[:60]:
              print("    ", f)
          print("=== vendor merge: still unresolved: %d ===" % len(unresolved))
          for f, t in unresolved[:60]:
              print("    ", f, "->", t)
          PYFIXLINKS

      - name: Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      # Required: this device has CONFIG_KPROBES disabled.
      - name: Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # The stock 4.14 OnePlus Makefile hardcodes `-no-integrated-as`
          # (Makefile:554) and derives clang --prefix from
          # `which aarch64-linux-gnu-elfedit` (Makefile:547).  build-env only
          # exports CROSS_COMPILE for Proton-Clang without installing the
          # cross binutils, so --prefix is empty and clang falls back to the
          # host x86 `as` in clang-custom/bin, which rejects arm64 `-EL`:
          #   clang-custom/bin/as: unrecognized option '-EL'
          # Fix 1: install real cross binutils so clang resolves <triple>-as.
          # Fix 2: a dispatcher on clang-custom/bin/as as a safety net, while
          #        preserving the original host assembler as `as.host` so the
          #        HOSTCC (scripts/dtc, genksyms, ...) builds are unaffected.
          sudo apt-get update -qq || echo "WARN: apt update failed"
          sudo apt-get install -y binutils-aarch64-linux-gnu || echo "WARN: cross binutils install failed"
          python3 - <<'PYASWRAP'
          import os, shutil
          ws = os.path.dirname(os.getcwd())
          cb = os.path.join(ws, "clang-custom", "bin")
          host_as = os.path.join(cb, "as")
          cross64 = os.path.join(cb, "aarch64-linux-gnu-as")
          backup = os.path.join(cb, "as.host")
          if os.path.isfile(cross64) and os.path.isfile(host_as) and not os.path.exists(backup):
              shutil.copy2(host_as, backup)
              script = (
                  "#!/bin/bash\n"
                  'HERE="$(cd "$(dirname "$0")" && pwd)"\n'
                  'for a in "$@"; do\n'
                  '  case "$a" in\n'
                  '    -EL|-EB)\n'
                  '      "$HERE/aarch64-linux-gnu-as" "$@" && exit 0\n'
                  '      if [ -x "$HERE/arm-linux-gnueabi-as" ]; then\n'
                  '        "$HERE/arm-linux-gnueabi-as" "$@" && exit 0\n'
                  '      fi\n'
                  '      exec "$HERE/as.host" "$@"\n'
                  '      ;;\n'
                  '  esac\n'
                  'done\n'
                  'exec "$HERE/as.host" "$@"\n'
              )
              with open(host_as, "w", encoding="utf-8", newline="\n") as f:
                  f.write(script)
              os.chmod(host_as, 0o755)
              print("=== fixup: as dispatcher installed (host=as.host, arm=GNU cross as) ===")
          else:
              print("=== fixup: as dispatcher skipped (already present or layout differs) ===")
          PYASWRAP
          # With the official vendor tree merged, everything should resolve.
          # This step only REPORTS any remaining dangling references (and
          # neutralises a `source` line only if its target is genuinely absent),
          # so the stock feature set is preserved.
          python3 - <<'PYSELFHEAL'
          import os, re
          root = os.getcwd()

          # 4.14 kernel + modern Proton-Clang: the `cc-option` probe for
          # -fstack-protector-strong fails, aborting prepare-compiler-check
          # (Makefile:1345).  Stack protector is a compile-time hardening
          # option only, so switching the choice to NONE keeps every stock
          # runtime feature intact while letting the build proceed.
          cfg = os.path.join(root, "arch/arm64/configs/vendor/sm8150-perf_defconfig")
          if os.path.isfile(cfg):
              lines = open(cfg, encoding="utf-8", errors="replace").read().splitlines(True)
              n = 0
              for i, l in enumerate(lines):
                  if l.strip() == "CONFIG_CC_STACKPROTECTOR_STRONG=y":
                      lines[i] = "# CONFIG_CC_STACKPROTECTOR_STRONG is not set\n"
                      n += 1
              if n:
                  lines.append("CONFIG_CC_STACKPROTECTOR_NONE=y\n")
                  open(cfg, "w", encoding="utf-8").writelines(lines)
              print("=== fixup: CONFIG_CC_STACKPROTECTOR_STRONG disabled: %d ===" % n)

          # ================= v45 WBSTACKCHK =================
          # 【v44 死因回顾】v44 试着真的打开 CONFIG_CC_STACKPROTECTOR_STRONG，
          # 实测刷入后 adb 230s 不出现、连 USB 都没枚举 → 死在 dwc3 init 之前。
          # 所以 v45 绝不碰这个选项，内核完全按 v33/v41 的配置编（NONE）。
          #
          # 【矛盾点】CONFIG 关掉后内核不再导出 __stack_chk_guard /
          # __stack_chk_fail，而 /vendor/lib/modules/*.ko 全部由
          # -fstack-protector-strong 编过，414 个未定义符号里恰好只缺这 2 个
          # （其余 412 个含 __icnss_register_driver 全部命中）。
          # 缺符号 → first-stage init LoadKernelModules() 只能载 5 个模块
          # → 无 boot_adsp → ADSP 永 OFFLINING → voice 恒 -517 → 无声卡。
          #
          # 【v45 做法】把这 2 个符号做成 vmlinux 内置，语义完全照抄已经实测
          # 稳定的外挂 stackchk_shim.ko：稳定非零 canary + 失败只打印不 panic。
          # 内置后 first-stage init 一开始就能解析 OEM 模块，不需要任何 shim 模块。

          # --- A. 内置符号提供者 ---
          srcp = os.path.join(root, "arch/arm64/kernel/wb_stackchk.c")
          src = (
              "/* v45 WBSTACKCHK: stack-protector symbols for OEM vendor modules.\n"
              " *\n"
              " * Built-in equivalent of the externally loaded stackchk_shim.ko that we\n"
              " * verified on this device (wlan0 came up, 25 modules loaded).\n"
              " * Semantics are copied verbatim from it on purpose:\n"
              " *   - a stable, non-zero canary that never changes at runtime;\n"
              " *   - __stack_chk_fail only complains + dump_stack(), it must NEVER\n"
              " *     panic (v34/v35/v36 all died from a panicking variant).\n"
              " *\n"
              " * Guarded by #ifndef so that it disappears if the kernel is ever built\n"
              " * with CONFIG_CC_STACKPROTECTOR again (stackprotector.c would collide).\n"
              " */\n"
              "#include <linux/kernel.h>\n"
              "#include <linux/export.h>\n"
              "#include <linux/kconfig.h>\n"
              "\n"
              "#ifndef CONFIG_CC_STACKPROTECTOR\n"
              "\n"
              "/* explicit so this file builds regardless of which header declares it */\n"
              "extern void dump_stack(void);\n"
              "\n"
              "unsigned long __stack_chk_guard = 0x2f3a9c1e5b7d4068UL;\n"
              "EXPORT_SYMBOL(__stack_chk_guard);\n"
              "\n"
              "void __stack_chk_fail(void)\n"
              "{\n"
              "\tpr_err(\"WB45STACKCHK: stack canary corrupted (not panicking)\\n\");\n"
              "\tdump_stack();\n"
              "}\n"
              "EXPORT_SYMBOL(__stack_chk_fail);\n"
              "\n"
              "#else\n"
              "static const char wb45_unused_tag[] __attribute__((unused)) = \"WB45STACKCHK\";\n"
              "\n"
              "#endif /* !CONFIG_CC_STACKPROTECTOR */\n"
          )
          open(srcp, "w", encoding="utf-8").write(src)
          print("=== v45 WBSTACKCHK: wrote arch/arm64/kernel/wb_stackchk.c ===")

          mkp = os.path.join(root, "arch/arm64/kernel/Makefile")
          if os.path.isfile(mkp):
              mtxt = open(mkp, encoding="utf-8", errors="replace").read()
              if "wb_stackchk" not in mtxt:
                  if not mtxt.endswith("\n"):
                      mtxt += "\n"
                  mtxt += "# v45 WBSTACKCHK\nobj-y += wb_stackchk.o\n"
                  open(mkp, "w", encoding="utf-8").write(mtxt)
                  print("=== v45 WBSTACKCHK: hooked into arch/arm64/kernel/Makefile ===")
              else:
                  print("=== v45 WBSTACKCHK: Makefile already hooked ===")
          else:
              print("=== v45 WBSTACKCHK: WARN Makefile not found ===")

          # --- B. panic 后能 warm reboot 留 ramoops ---
          # 原设定 CONFIG_PANIC_TIMEOUT=-1 + QCOM_FORCE_WDOG_BITE_ON_PANIC=y
          # 会让 panic 直接硬断电，DRAM 与 ramoops 一起丢，事后完全无日志。
          # 改成 15s + 关 watchdog bite，内核才会自己重启并留下现场。
          p = os.path.join(root, "arch/arm64/configs/vendor/sm8150-perf_defconfig")
          if os.path.isfile(p):
              txt = open(p, encoding="utf-8", errors="replace").read()
              lines = [l for l in txt.splitlines(True)
                       if not l.strip().startswith("CONFIG_PANIC_TIMEOUT=")
                       and not l.strip().startswith("CONFIG_QCOM_FORCE_WDOG_BITE_ON_PANIC")]
              lines.append("CONFIG_PANIC_TIMEOUT=15\n")
              lines.append("# CONFIG_QCOM_FORCE_WDOG_BITE_ON_PANIC is not set\n")
              open(p, "w", encoding="utf-8").writelines(lines)
              print("=== v45 WBSTACKCHK: PANIC_TIMEOUT=15, WDOG_BITE disabled ===")
          # =============== v45 WBSTACKCHK 结束 ===============

          # clang-13 (Proton-Clang) vs the stock 4.14 OnePlus Makefile:
          # Makefile:1003-1015 promotes five legacy warnings to hard errors via
          #   KBUILD_CFLAGS += $(call cc-option,-Werror=XXX)
          # Two separate failures with clang-13:
          #   * -Werror=strict-prototypes kills vendor code such as
          #         void adjust_sched_assist_input_ctrl(){ ... }
          #   * -Werror=designated-init is NOT a valid clang warning group;
          #     CLANG_FLAGS (Makefile:555) has -Werror=unknown-warning-option,
          #     so adding any -Wno-error=<invalid> aborts EVERY compile unit
          #     at scripts/mod/empty.o (this is what broke v7).
          # Stock clang-10 treated these as plain warnings.  Commenting out
          # those five lines restores that behaviour WITHOUT introducing a
          # single new compiler flag.  Real errors are untouched: undefined
          # symbols still fail, and -Werror-implicit-function-declaration
          # (Makefile:430, not a cc-option line) stays in force.
          mk = os.path.join(root, "Makefile")
          if os.path.isfile(mk):
              lines = open(mk, encoding="utf-8", errors="replace").read().splitlines(True)
              n = 0
              for i, l in enumerate(lines):
                  s = l.strip()
                  if (s.startswith("KBUILD_CFLAGS") and
                          "$(call cc-option,-Werror=" in s and
                          "SUKISU_WERROR_FIXUP" not in l):
                      lines[i] = "# [SUKISU_WERROR_FIXUP] " + l.lstrip()
                      n += 1
              if n:
                  open(mk, "w", encoding="utf-8").writelines(lines)
              print("=== fixup: commented out %d -Werror= lines ===" % n)

          # SukiSU-Ultra builtin (v4.3.0-r2 / SUSFS v2.4.0) includes
          # <linux/static_call.h> unconditionally in kernel_includes.h.
          # static_call landed in Linux 5.10; our 4.14.180 has no such header
          # (v8 failure: drivers/kernelsu/kernel_includes.h:76 fatal error).
          # The whole SukiSU tree references static_call exactly once -- this
          # include -- and never calls any of its APIs, so a version guard is
          # behaviour-preserving on both old and new kernels.
          ksu_hdr = os.path.join(root, "drivers", "kernelsu", "kernel_includes.h")
          if os.path.isfile(ksu_hdr):
              src = open(ksu_hdr, encoding="utf-8", errors="replace").read()
              n = 0
              if "SUKISU_STATIC_CALL_FIXUP" not in src:
                  lines = src.splitlines(True)
                  for i, l in enumerate(lines):
                      if l.strip() == "#include <linux/static_call.h>":
                          lines[i] = ("// [SUKISU_STATIC_CALL_FIXUP] header exists only on 5.10+\n"
                                      "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)\n"
                                      + l + "#endif\n")
                          n += 1
                  if n:
                      open(ksu_hdr, "w", encoding="utf-8").writelines(lines)
              print("=== fixup: static_call.h guarded by kernel version: %d ===" % n)

          # SukiSU-Ultra builtin (v4.3.0-r2) merges extension/cpu_spoof.c
          # into ksu_main.c.  It pulls in <vdso/datapage.h> and
          # <vdso/clocksource.h> plus the whole generic vDSO time family
          # (struct vdso_data, enum vdso_clock_mode,
          # VDSO_CLOCKMODE_ARCHTIMER, CS_HRES_COARSE, ...).  Those exist
          # only on 5.10+; 4.14 arm64 has just the legacy
          # asm/vdso_datapage.h with a different layout
          # (v9 failure: extension/cpu_spoof.c:29 fatal error).
          # CPU identity spoofing is NOT in our feature set, and the whole
          # extension exports exactly one symbol, so on <5.10 we keep the
          # symbol as an -EOPNOTSUPP stub.  Every other extension, the
          # root path and the whole SuSFS hiding path stay compiled exactly
          # as upstream ships them.
          cpu_spoof = os.path.join(root, "drivers", "kernelsu", "extension", "cpu_spoof.c")
          if os.path.isfile(cpu_spoof):
              src = open(cpu_spoof, encoding="utf-8", errors="replace").read()
              n = 0
              if ("SUKISU_414_CPU_SPOOF_STUB" not in src and
                      "#include <vdso/datapage.h>" in src):
                  guard = (
                      "// [SUKISU_414_CPU_SPOOF_STUB] generic vDSO API exists only on 5.10+\n"
                      "#include <linux/version.h>\n"
                      "#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 10, 0)\n"
                      "#include <linux/kernel.h>\n"
                      "#include <linux/types.h>\n"
                      "#include <linux/errno.h>\n"
                      "#include <linux/uaccess.h>\n"
                      "int ksu_extension_cpu_spoof_io(u32 id, void __user *raw)\n"
                      "{\n"
                      "    (void)id;\n"
                      "    (void)raw;\n"
                      "    return -EOPNOTSUPP;\n"
                      "}\n"
                      "#else\n"
                  )
                  open(cpu_spoof, "w", encoding="utf-8").write(
                      guard + src.rstrip("\n") +
                      "\n#endif /* SUKISU_414_CPU_SPOOF_STUB */\n")
                  n = 1
              print("=== fixup: cpu_spoof.c stubbed for <5.10: %d ===" % n)

          # ---- v25: pin the SukiSU driver to the boot-verified commit ----
          # Device boot matrix: v22 (driver @ 850149efa4) boots 2/2;
          # v23/v24 (driver @ 6076949f26 "selinux: fix reset_avc_cache() on
          # < 5.10 kernels", landed 2026-11-11T17:35Z, 18 minutes AFTER the
          # v22 kernel binary was produced) fail to boot 0/4 with identical
          # config/toolchain/size.  setup.sh clones builtin HEAD unpinned, so
          # every build was a moving target.  Pin the driver back to the last
          # commit verified to boot (850149efa429d9076696c9ccef2336302d50d955).
          # The SUSFS patches repo is pinned separately inside the patch-susfs
          # composite (bfb739425e).  ORDER MATTERS: this checkout runs FIRST,
          # before ANY PYSELFHEAL driver-tree modification (v11 compat shims,
          # v20 __aligned(8), v24 selinux.c bridge) so every fix re-applies on
          # the pristine pinned tree.  v25a lesson: placing this block after
          # the v11 compat fixes made `git checkout` silently revert the
          # rules.c pol->latest_granting fix and the build died on it.
          import subprocess as _sp
          _KSU_PIN = "850149efa429d9076696c9ccef2336302d50d955"
          _ksu_dir = os.path.join(root, "KernelSU")
          if os.path.isdir(_ksu_dir):
              def _git25(*_a):
                  return _sp.run(["git"] + list(_a), cwd=_ksu_dir,
                                 capture_output=True, text=True)
              _h25 = _git25("rev-parse", "HEAD")
              if _h25.returncode != 0:
                  print("=== fixup: v25 KernelSU dir not a git repo: %s ===" % _h25.stderr.strip()[:100])
              elif _h25.stdout.strip() == _KSU_PIN:
                  print("=== fixup: v25 driver already pinned at %s ===" % _KSU_PIN[:10])
              else:
                  _was25 = _h25.stdout.strip()[:10]
                  _c25 = _git25("checkout", "--detach", _KSU_PIN)
                  if _c25.returncode != 0:
                      _f25 = _git25("fetch", "--depth=1", "origin", _KSU_PIN)
                      if _f25.returncode != 0:
                          print("=== fixup: v25 driver fetch failed: %s ===" % _f25.stderr.strip()[:150])
                      else:
                          _c25 = _git25("checkout", "--detach", "FETCH_HEAD")
                  if _c25.returncode == 0:
                      print("=== fixup: v25 driver pinned to %s (was %s) ===" % (_KSU_PIN[:10], _was25))
                  else:
                      print("=== fixup: v25 driver checkout failed: %s ===" % _c25.stderr.strip()[:150])
          else:
              print("=== fixup: v25 KernelSU dir not found at %s ===" % _ksu_dir)
          # ---- v11: route newly-added SukiSU code through its own 4.14 shims ----
          # v10 (run 42995708433) got past cpu_spoof and exposed 6 errors in
          # the single ksu_main.o translation unit, plus 1 in a stock OnePlus
          # camera driver.  kernel_compat.h ALREADY provides ksu_access_ok,
          # ksu_strncpy_from_user_nofault and the old-kernel helpers; the new
          # v4.3.0 code merely calls the 5.x names directly.
          COMPAT = "SUKISU_414_COMPAT_V11"
          ksu_dir = os.path.join(root, "drivers", "kernelsu")

          def compat_sub(rel, pairs):
              p = os.path.join(ksu_dir, rel)
              if not os.path.isfile(p):
                  print("  compat: missing", rel)
                  return 0
              src = open(p, encoding="utf-8", errors="replace").read()
              if COMPAT in src:
                  print("  compat: %-42s already patched" % rel)
                  return 0
              n = 0
              for old, new in pairs:
                  n += src.count(old)
                  src = src.replace(old, new)
              if n:
                  src = "// [%s] 4.14 API compatibility\n" % COMPAT + src
                  open(p, "w", encoding="utf-8").write(src)
              print("  compat: %-42s %d site(s)" % (rel, n))
              return n

          total = 0
          total += compat_sub(os.path.join("extension", "kpm", "kpm.c"),
                              [("if (!access_ok(", "if (!ksu_access_ok(")])
          total += compat_sub(os.path.join("supercall", "dispatch.c"),
                              [("kvcalloc(", "kcalloc(")])
          # NOTE: event.c already calls ksu_strncpy_from_user_nofault in two
          # other places; match the WHOLE un-migrated line so a plain
          # substring replace cannot turn those into ksu_ksu_...
          total += compat_sub(os.path.join("sulog", "event.c"),
                              [("            strncpy_from_user_nofault(arg, "
                                "(const void __user *)untagged_addr((unsigned long)arg_user), sizeof(arg));",
                                "            ksu_strncpy_from_user_nofault(arg, "
                                "(const void __user *)untagged_addr((unsigned long)arg_user), sizeof(arg));")])

          # rules.c: the <5.10 #else branches reference `pol`, which is only
          # declared for >=5.10.  4.14 has no ->latest_granting; pass 0 to
          # avc_ss_reset (the classic force-flush) instead.  Keep the >=5.10
          # branches untouched.
          rules = os.path.join(ksu_dir, "selinux", "rules.c")
          if os.path.isfile(rules):
              rsrc = open(rules, encoding="utf-8", errors="replace").read()
              if COMPAT not in rsrc:
                  lines = rsrc.splitlines(True)
                  depth = 0
                  watch = None
                  old_branch = False
                  n = 0
                  for i, l in enumerate(lines):
                      s = l.strip()
                      if s.startswith("#if"):
                          depth += 1
                          if "LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)" in s:
                              watch = depth
                      elif s.startswith("#elif") and depth == watch:
                          old_branch = False
                      elif s.startswith("#else") and depth == watch:
                          old_branch = True
                      elif s.startswith("#endif"):
                          if depth == watch:
                              watch = None
                              old_branch = False
                          depth -= 1
                      elif old_branch and "reset_avc_cache(pol->latest_granting)" in s:
                          lines[i] = l.replace("reset_avc_cache(pol->latest_granting)",
                                               "reset_avc_cache(0)")
                          n += 1
                  if n:
                      lines.insert(0, "// [%s] 4.14 AVC flush\n" % COMPAT)
                      open(rules, "w", encoding="utf-8").writelines(lines)
                  total += n
                  print("  compat: %-42s %d site(s)" % ("selinux/rules.c", n))

          # ---- v12: stock OnePlus camera header needs the FULL struct ----
          # v11 (run 42998073130) proved a bare forward declaration is not
          # enough: cam_context_utils.c dereferences cmd->buf_handle, and on
          # this tree <media/cam_defs.h> resolves through OP_8150_ADAPT to
          # cam_defs_op.h, which does NOT define struct cam_dump_req_cmd.
          # Provide the complete definition (verbatim fields from
          # include/uapi/media/cam_defs.h) guarded by a private macro, and
          # guard the stock definition with the same macro, so the type is
          # defined exactly once whichever branch the build takes.
          CAM_GUARD = "SUKISU_CAM_DUMP_REQ_CMD_DEFINED"
          cam_struct = (
              "struct cam_dump_req_cmd {\n"
              "\tint64_t  issue_req_id;\n"
              "\tint32_t  session_handle;\n"
              "\tint32_t  link_hdl;\n"
              "\tint32_t  dev_handle;\n"
              "\tint32_t  error_type;\n"
              "\tuint32_t buf_handle;\n"
              "\tint32_t  offset;\n"
              "\tuint32_t reserved;\n"
              "};\n")
          cam_h = os.path.join(root, "drivers", "media", "platform", "msm",
                               "camera", "cam_core", "cam_context.h")
          if os.path.isfile(cam_h):
              csrc = open(cam_h, encoding="utf-8", errors="replace").read()
              if COMPAT not in csrc and "struct cam_context;" in csrc:
                  block = ("struct cam_context;\n"
                           "/* [%s] full definition; OP_8150_ADAPT omits it */\n" % COMPAT
                           + "#ifndef %s\n" % CAM_GUARD
                           + "#define %s\n" % CAM_GUARD
                           + cam_struct
                           + "#endif\n")
                  csrc = csrc.replace("struct cam_context;", block.rstrip("\n"), 1)
                  open(cam_h, "w", encoding="utf-8").write(csrc)
                  total += 1
                  print("  compat: cam_context.h full cam_dump_req_cmd definition")
          cam_defs = os.path.join(root, "include", "uapi", "media", "cam_defs.h")
          if os.path.isfile(cam_defs):
              dsrc = open(cam_defs, encoding="utf-8", errors="replace").read()
              if CAM_GUARD not in dsrc:
                  lines = dsrc.splitlines(True)
                  start = next((i for i, l in enumerate(lines)
                                if l.strip() == "struct cam_dump_req_cmd {"), None)
                  end = None
                  if start is not None:
                      end = next((i for i in range(start + 1, len(lines))
                                  if lines[i].strip() == "};"), None)
                  if end is not None:
                      lines[start:start] = ["#ifndef %s\n" % CAM_GUARD,
                                           "#define %s\n" % CAM_GUARD]
                      lines.insert(end + 3, "#endif /* %s */\n" % CAM_GUARD)
                      open(cam_defs, "w", encoding="utf-8").writelines(lines)
                      total += 1
                      print("  compat: cam_defs.h stock definition guarded")
          # ---- v14: neutralise -DOP_8150_ADAPT so the FULL (complete) UAPI
          # headers are used.  OplusKernelEnvConfig.mk adds -DOP_8150_ADAPT
          # only when TARGET_PRODUCT=msmnile; under it every <media/cam_*.h>
          # switches, via `#if defined(OP_8150_ADAPT)`, to a STRICT SUBSET
          # *_op.h (cam_defs_op.h, cam_isp_op.h, cam_sensor_op.h, ...) that
          # drops structs/macros the stock camera drivers still reference
          # (v12 CAM_DUMP_REQ, v13 struct cam_isp_sensor_dimension, and more).
          # The OnePlus 7 Pro (guacamole) is an sm8150 device whose real OOS12
          # kernel is built with a product-specific TARGET_PRODUCT, NOT raw
          # msmnile, so OP_8150_ADAPT is OFF and the full headers are the
          # correct, complete set.  The CI build script blindly sets msmnile
          # for sm8150, wrongly triggering the reduced headers.  Removing only
          # the -DOP_8150_ADAPT additions (TARGET_PRODUCT + every other vendor
          # flag stay intact) makes the build use the complete headers without
          # touching device selection.  Idempotent; regex tolerates the
          # inconsistent += spacing in the makefile.
          import re as _re
          mkcfg = os.path.join(root, "OplusKernelEnvConfig.mk")
          if os.path.isfile(mkcfg):
              src = open(mkcfg, encoding="utf-8", errors="replace").read()
              if "SUKISU_OP8150_ADAPT_DISABLED" not in src:
                  _pat = _re.compile(
                      r"(KBUILD_CFLAGS|KBUILD_CPPFLAGS|CFLAGS_KERNEL|"
                      r"CFLAGS_MODULE)\s*[+]=\s*-DOP_8150_ADAPT")
                  new_src, reps = _pat.subn(
                      lambda m: "# [SUKISU_OP8150_ADAPT_DISABLED] " + m.group(0),
                      src)
                  if reps:
                      open(mkcfg, "w", encoding="utf-8").write(new_src)
                  print("=== fixup: OP_8150_ADAPT -D removed from "
                        "OplusKernelEnvConfig.mk: %d ===" % reps)
              else:
                  print("=== fixup: OP_8150_ADAPT already disabled ===")
          # Safety net: any other Makefile/Kbuild/*.mk that injects
          # -DOP_8150_ADAPT (in case the CI build script adds it elsewhere)
          # is neutralised the same way, so the reduced *_op.h headers can
          # never be selected regardless of where the macro originates.
          _total = 0
          for _dir, _sub, _files in os.walk(root):
              for _fn in _files:
                  if _fn not in ("Makefile", "Kbuild") and not _fn.endswith(".mk"):
                      continue
                  _p = os.path.join(_dir, _fn)
                  try:
                      _s = open(_p, encoding="utf-8", errors="replace").read()
                  except OSError:
                      continue
                  if "-DOP_8150_ADAPT" not in _s:
                      continue
                  _ns, _r = _pat.subn(
                      lambda m: "# [SUKISU_OP8150_ADAPT_DISABLED] " + m.group(0),
                      _s)
                  if _r:
                      open(_p, "w", encoding="utf-8").write(_ns)
                      _total += _r
          if _total:
              print("=== fixup: OP_8150_ADAPT -D removed from other "
                    "Makefiles/Kbuild: %d ===" % _total)
          # ---- v15: emulate OnePlus's official source-tree layout ----
          # Stock oplus power drivers (e.g. drivers/power/oplus/charger_ic/
          # oplus_battery_msm8150Q.h:25) include headers via a path that assumes
          # the kernel lives under a parent "kernel/msm-4.14/" directory:
          #   #include "../../../../kernel/msm-4.14/drivers/power/supply/qcom/storm-watch.h"
          # In OnePlus's full AOSP tree the kernel repo IS checked out at
          # <aosp>/kernel/msm-4.14/, so that relative path resolves.  In our
          # standalone build the repo root IS the kernel root, making the
          # "kernel/msm-4.14/" segment dangling -> header not found.
          # Fix: create <root>/kernel/msm-4.14 as a symlink -> ".." (the kernel
          # root itself), mirroring the official layout so every
          # ".../kernel/msm-4.14/..." reference resolves to real source.
          # Idempotent and layout-independent (uses root = kernel root).
          _kdir = os.path.join(root, "kernel")
          os.makedirs(_kdir, exist_ok=True)
          _link = os.path.join(_kdir, "msm-4.14")
          # Use an absolute target (the kernel root itself) so the symlink
          # resolves correctly on any OS.  A relative ".." target is
          # misinterpreted by some resolve() implementations; absolute is
          # unambiguous and maps <root>/kernel/msm-4.14 -> <root>.
          _target = os.path.abspath(root)
          if os.path.islink(_link):
              if os.path.abspath(os.readlink(_link)) != _target:
                  os.remove(_link)
                  os.symlink(_target, _link)
              print("=== fixup: kernel/msm-4.14 symlink present -> "
                    "%s ===" % os.readlink(_link))
          elif os.path.exists(_link):
              print("=== fixup: kernel/msm-4.14 exists as real path; "
                    "leaving it (layout may differ) ===")
          else:
              os.symlink(_target, _link)
              print("=== fixup: kernel/msm-4.14 -> %s symlink created ==="
                    % _target)
          _probe = os.path.join(root, "kernel", "msm-4.14",
                                "drivers", "power", "supply", "qcom", "storm-watch.h")
          print("=== fixup: storm-watch.h resolves after layout fixup: %s ==="
                % os.path.exists(_probe))
          # ---- v16: scm.o uses clang's integrated assembler (`.arch_extension
          # sec`) + upgrade bundled aarch64 GNU as to distro binutils ----
          # drivers/soc/qcom/scm.c contains inline asm with `.arch_extension
          # sec`, which Proton-Clang's *bundled* GNU as (old binutils) rejects,
          # aborting the whole file in ARM/32-bit mode.  Override the global
          # `-no-integrated-as` (OnePlus Makefile:554) for scm.o only via a
          # per-file CFLAGS so LLVM's MC assembler (which tolerates `sec`) is
          # used.  No source change, no runtime-behaviour change.
          import subprocess as _sp
          import shutil as _shutil
          _scm_make = os.path.join(root, "drivers", "soc", "qcom", "Makefile")
          if os.path.isfile(_scm_make):
              _mk = open(_scm_make, encoding="utf-8", errors="replace").read()
              if "scm.o" in _mk and "integrated-as" not in _mk:
                  if not _mk.endswith("\n"):
                      _mk += "\n"
                  _mk += ("# [SUKISU_V16] scm.o: use clang integrated assembler "
                          "for `.arch_extension sec`\n"
                          "CFLAGS_scm.o := -integrated-as\n")
                  open(_scm_make, "w", encoding="utf-8").write(_mk)
                  print("=== fixup: v16 per-file CFLAGS_scm.o += -integrated-as ===")
              else:
                  print("=== fixup: v16 scm.o flag already present ===")
          else:
              print("=== fixup: v16 drivers/soc/qcom/Makefile NOT found ===")
          # Belt-and-braces: upgrade the bundled aarch64 GNU as to distro
          # binutils (2.38 understands `.arch_extension sec`), in case any other
          # file still reaches the external assembler.
          _ws = os.path.dirname(root)
          _apt_as = "/usr/bin/aarch64-linux-gnu-as"
          _bundled_as = os.path.join(_ws, "clang-custom", "bin", "aarch64-linux-gnu-as")
          if os.path.isfile(_apt_as):
              try:
                  _v = _sp.run([_apt_as, "--version"],
                               capture_output=True, text=True, timeout=20)
                  print("=== fixup: distro aarch64-linux-gnu-as:",
                        (_v.stdout.splitlines()[0] if _v.stdout else "unknown"))
              except Exception as _e:
                  print("=== fixup: distro as version check err:", _e)
              try:
                  _shutil.copy2(_apt_as, _bundled_as)
                  print("=== fixup: bundled aarch64-linux-gnu-as upgraded to distro ===")
              except Exception as _e:
                  print("=== fixup: bundled as upgrade skipped:", _e)
          else:
              print("=== fixup: distro aarch64-linux-gnu-as absent; "
                    "relying on integrated-as for scm.o ===")
          # ---- v17: disable CONFIG_MODVERSIONS (Clang/LLD kcrctab link error) ----
          # 4.14 + Clang: genksyms cannot generate a CRC for some EXPORT_SYMBOL
          # (e.g. gsi_write_channel_scratch), so LLD fails at vmlinux link with
          # "relocation R_AARCH64_ABS32 cannot be used against symbol __crc_*;
          #  recompile with -fPIC". We build a built-in kernel with no external
          # .ko modules (SukiSU is a builtin syscall-hook; KPM is off), so module
          # versioning is unnecessary. Disabling it in the defconfig removes the
          # entire kcrctab mechanism (all __crc_* references vanish).
          _cfg = os.path.join(root,
                              "arch/arm64/configs/vendor/sm8150-perf_defconfig")
          if os.path.isfile(_cfg):
              _cd = open(_cfg, encoding="utf-8", errors="replace").read()
              _new = re.sub(r"^\s*CONFIG_MODVERSIONS[ =].*$",
                            "# CONFIG_MODVERSIONS is not set", _cd, flags=re.M)
              if _new != _cd or "CONFIG_MODVERSIONS" not in _cd:
                  if "# CONFIG_MODVERSIONS is not set" not in _new:
                      _new = _new.rstrip("\n") + "\n# CONFIG_MODVERSIONS is not set\n"
                  open(_cfg, "w", encoding="utf-8").write(_new)
                  print("=== fixup: v17 CONFIG_MODVERSIONS disabled in defconfig ===")
              else:
                  print("=== fixup: v17 CONFIG_MODVERSIONS already disabled ===")
          else:
              print("=== fixup: v17 defconfig not found at %s ===" % _cfg)

          # ---- v33: allow vendor-signed .ko modules to load (WiFi/sound fix) ----
          # Root cause (measured on device, slot _b):
          #   insmod /vendor/lib/modules/qca_cld3_wlan.ko
          #     -> "Required key not available" / "PKCS#7 signature not signed
          #        with a trusted key"  (err = -ENOKEY)
          #   CONFIG_MODULE_SIG_FORCE=y makes sig_enforce=true at boot, and
          #   sig_enforce is bool_enable_only (0->1 only) so it cannot be turned
          #   off at runtime. All 34 vendor modules in modules.load were refused,
          #   which is why wlan0 never appeared and audio HAL services vanished.
          #   4.14 kernel/module.c module_sig_check() clears -ENOKEY when
          #   !is_module_sig_enforced(), so simply dropping SIG_FORCE from the
          #   defconfig lets the OEM-signed modules load.
          # Second gate: v17 disables CONFIG_MODVERSIONS, so the kernel vermagic
          #   is "4.14.180-perf+ SMP preempt mod_unload aarch64" while the vendor
          #   .ko carries "... mod_unload modversions aarch64". same_magic()
          #   would reject it. Patch vermagic.h so the kernel advertises the
          #   "modversions " tag too. CONFIG_MODVERSIONS stays OFF, so
          #   check_version() is a no-op (no symbol CRC checks) and we avoid the
          #   Clang/LLD __crc_* vmlinux link error that v17 was working around.
          _cfg33 = os.path.join(root,
                                "arch/arm64/configs/vendor/sm8150-perf_defconfig")
          if os.path.isfile(_cfg33):
              _c33 = open(_cfg33, encoding="utf-8", errors="replace").read()
              _n33 = re.sub(r"^\s*CONFIG_MODULE_SIG_FORCE[ =].*$",
                            "# CONFIG_MODULE_SIG_FORCE is not set", _c33, flags=re.M)
              if "# CONFIG_MODULE_SIG_FORCE is not set" not in _n33:
                  _n33 = _n33.rstrip("\n") + "\n# CONFIG_MODULE_SIG_FORCE is not set\n"
              if _n33 != _c33:
                  open(_cfg33, "w", encoding="utf-8").write(_n33)
                  print("=== fixup: v33 CONFIG_MODULE_SIG_FORCE disabled in defconfig ===")
              else:
                  print("=== fixup: v33 CONFIG_MODULE_SIG_FORCE already disabled ===")
          else:
              print("=== fixup: v33 defconfig not found at %s ===" % _cfg33)

          _vh33 = os.path.join(root, "include", "linux", "vermagic.h")
          if os.path.isfile(_vh33):
              _t33 = open(_vh33, encoding="utf-8", errors="replace").read()
              if "WB-V33" in _t33:
                  print("=== fixup: v33 vermagic already patched ===")
              else:
                  _old33 = ('#ifdef CONFIG_MODVERSIONS\n'
                            '#define MODULE_VERMAGIC_MODVERSIONS "modversions "\n'
                            '#else\n'
                            '#define MODULE_VERMAGIC_MODVERSIONS ""\n'
                            '#endif')
                  _new33 = ('/* WB-V33: advertise the modversions tag so vendor-signed\n'
                            ' * .ko modules (built against the stock OEM kernel with\n'
                            ' * CONFIG_MODVERSIONS=y) pass same_magic(). CRC checks\n'
                            ' * stay disabled in this kernel, so this is cosmetic. */\n'
                            '#define MODULE_VERMAGIC_MODVERSIONS "modversions "')
                  if _old33 in _t33:
                      _t33 = _t33.replace(_old33, _new33, 1)
                      open(_vh33, "w", encoding="utf-8").write(_t33)
                      print("=== fixup: v33 vermagic.h patched (exact block) ===")
                  else:
                      # 宽松兜底：逐行替换 #else 分支里的空串定义
                      _n33b = re.sub(
                          r'^#define MODULE_VERMAGIC_MODVERSIONS ""\s*$',
                          '#define MODULE_VERMAGIC_MODVERSIONS "modversions "  /* WB-V33 */',
                          _t33, flags=re.M)
                      if _n33b != _t33:
                          open(_vh33, "w", encoding="utf-8").write(_n33b)
                          print("=== fixup: v33 vermagic.h patched (loose fallback) ===")
                      else:
                          print("=== fixup: v33 vermagic.h anchor NOT FOUND ===")
          else:
              print("=== fixup: v33 vermagic.h not found at %s ===" % _vh33)

          # ---- v41: default the NFC chipset so pn544_probe() can bind ----
          # Measured on device (slot _b, v33 + stackchk_shim + OEM wlan):
          #   * /proc/device-tree has NO "oplus-nfc-chipset" node
          #     (grep -rl oplus-nfc-chipset /proc/device-tree -> empty)
          #   * /proc/oplus_nfc/ does not exist  -> oplus_nfc_probe() never ran
          #   * /sys/bus/i2c/devices/4-0028 = "pn544" (nxp,pn544 on i2c-4)
          #     but /sys/bus/i2c/drivers/pn553/ and /nq-nci/ are both empty
          #   * /dev/pn553 missing, and the HAL binary
          #     /odm/bin/hw/android.hardware.nfc@1.2-service hardcodes
          #     "/dev/pn553" (strings), while pn544_probe() registers a misc
          #     device literally named "pn553" -> the names DO match.
          # So the ONLY gate is CHECK_NFC_CHIP(PN557) in pn553.c:
          #     is_support_chip() -> support_nfc == false -> return -ENOMEM
          # and support_nfc is set only by oplus_nfc_probe(), which never runs
          # because the dts node is absent in the OSS device tree.
          # Default it in the subsys_initcall; platform_driver_register() probes
          # afterwards, so a real dts node still wins.
          _nf41 = os.path.join(root, "drivers", "nfc", "oplus_nfc", "oplus_nfc.c")
          if os.path.isfile(_nf41):
              _t41 = open(_nf41, encoding="utf-8", errors="replace").read()
              if "WB-V41" in _t41:
                  print("=== fixup: v41 NFC chipset default already applied ===")
              else:
                  _patch41 = (
                      '\t/* WB-V41: guacamole OOS12 device tree ships no\n'
                      '\t * "oplus-nfc-chipset" node, so oplus_nfc_probe() never\n'
                      '\t * runs and support_nfc stays false. pn553.c\n'
                      '\t * pn544_probe() begins with CHECK_NFC_CHIP(PN557), which\n'
                      '\t * then returns -ENOMEM: the driver never binds,\n'
                      '\t * /dev/pn553 is never created, and the NFC HAL\n'
                      '\t * (/odm/bin/hw/android.hardware.nfc@1.2-service, which\n'
                      '\t * opens /dev/pn553) cannot register its interface.\n'
                      '\t * com.android.nfc then crash-loops and takes zygote /\n'
                      '\t * system_server down with it. Default the chipset so\n'
                      '\t * probe proceeds; a real dts node still overrides this\n'
                      '\t * because platform_driver_register() probes later.\n'
                      '\t */\n'
                      '\tif (!support_nfc) {\n'
                      '\t\tstrcpy(current_chipset, "PN557");\n'
                      '\t\tsupport_nfc = true;\n'
                      '\t\tpr_err("WB-V41: default chipset PN557"\n'
                      '\t\t       " (no oplus-nfc-chipset node)\\n");\n'
                      '\t}\n')
                  _old41 = ('static int __init oplus_nfc_init(void)\n'
                            '{\n'
                            '\tpr_err("enter %s", __func__);\n')
                  if _old41 in _t41:
                      _t41 = _t41.replace(_old41, _old41 + _patch41, 1)
                      open(_nf41, "w", encoding="utf-8").write(_t41)
                      print("=== fixup: v41 NFC chipset default injected (exact) ===")
                  else:
                      # fallback: 直接插在已经确认存在的 register 行之前
                      _reg41 = "\treturn platform_driver_register(&oplus_nfc_driver);\n"
                      if _reg41 in _t41:
                          _t41 = _t41.replace(_reg41, _patch41 + _reg41, 1)
                          open(_nf41, "w", encoding="utf-8").write(_t41)
                          print("=== fixup: v41 NFC chipset default injected (fallback) ===")
                      else:
                          print("=== fixup: v41 NFC anchor NOT FOUND in %s ===" % _nf41)
              _chk41 = open(_nf41, encoding="utf-8", errors="replace").read()
              print("=== fixup: v41 verify WB-V41=%s support_nfc=%s ==="
                    % ("WB-V41" in _chk41, "support_nfc = true" in _chk41))
          else:
              print("=== fixup: v41 oplus_nfc.c not found at %s ===" % _nf41)
          # ---- v18: fix LLD "improper alignment for R_AARCH64_LDST32_ABS_LO12_NC" ----
          # 4.14 + Clang/LLD dies linking vmlinux with:
          #   ld.lld: error: ... improper alignment for relocation
          #   R_AARCH64_LDST32_ABS_LO12_NC: 0x...BFD is not aligned to 4 bytes
          # The `_NC` variant means "no-check", but the LLD bundled in Proton-
          # Clang 13 still enforces alignment here (later LLD relaxed it).
