                      broken.append(os.path.relpath(fp, root))
          print("=== diagnostics: broken symlinks: %d ===" % len(broken))
          for b in broken[:80]:
              print("    ", b)
          missing_obj = []
          for dirpath, dirs, files in os.walk(root):
              if ".git" in dirpath or "/out" in dirpath:
                  continue
              for fn in files:
                  if fn != "Makefile" and fn != "Kbuild":
                      continue
                  p = os.path.join(dirpath, fn)
                  try:
                      for l in open(p, encoding="utf-8", errors="replace"):
                          m = re.search(r'^\s*obj-[^=]*\+=\s+([A-Za-z0-9_./-]+)/\s*$', l)
                          if m and not os.path.isdir(os.path.join(dirpath, m.group(1))):
                              missing_obj.append((os.path.relpath(p, root), m.group(1)))
                  except Exception:
                      pass
          print("=== diagnostics: Makefile obj- dirs absent: %d ===" % len(missing_obj))
          for p, d in missing_obj[:80]:
              print("    ", p, "->", d)
          PYSELFHEAL
