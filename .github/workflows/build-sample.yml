      - name: Build Process
        uses: ./.github/workflows/build-process
      - name: Build vendor WLAN module (WB-V37)
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          if [ -n "${{ env.CLANG_SOURCE }}" ]; then
            export PATH=$GITHUB_WORKSPACE/clang-custom/bin:$PATH
          fi
          echo "=== WB-V37: building wlan.ko from official qcacld-3.0 source ==="
          make -j$(nproc --all) CC="ccache clang" ${{ env.CUSTOM_CMDS }} ${{ env.EXTRA_CMDS }} O=out ARCH=arm64 modules > wlan_build.log 2>&1 || true
          tail -60 wlan_build.log || true
          if ! find out -name 'wlan.ko' | grep -q wlan.ko; then
            echo "=== WB-V37: no wlan.ko from full modules build, retry with M= ==="
            make -j$(nproc --all) CC="ccache clang" ${{ env.CUSTOM_CMDS }} ${{ env.EXTRA_CMDS }} O=out ARCH=arm64 M=drivers/staging/qcacld-3.0 modules > wlan_build_m.log 2>&1 || true
            tail -60 wlan_build_m.log || true
          fi
          echo "=== WB-V37: wlan.ko candidates ==="
          find out -name 'wlan.ko' -exec ls -l {} \; || true
          mkdir -p $GITHUB_WORKSPACE/wlan_out
          find out -name 'wlan.ko' -exec cp -v {} $GITHUB_WORKSPACE/wlan_out/ \; || true
          echo "=== WB-V37: collected ==="
          ls -la $GITHUB_WORKSPACE/wlan_out || true

      - name: Upload wlan.ko (WB-V37)
        uses: actions/upload-artifact@v4
        with:
          name: wlan-ko
          path: ${{ github.workspace }}/wlan_out/wlan.ko
          if-no-files-found: warn
      - name: Build stackchk shim (WB-V38)
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          if [ -n "${{ env.CLANG_SOURCE }}" ]; then
            export PATH=$GITHUB_WORKSPACE/clang-custom/bin:$PATH
          fi
          echo "=== WB-V38: building stackchk_shim.ko ==="
          mkdir -p wb_shim
          echo '' | base64 -d > wb_shim/stackchk_shim.c
          printf 'obj-m := stackchk_shim.o\n' > wb_shim/Makefile
          wc -c wb_shim/stackchk_shim.c wb_shim/Makefile || true
          make -j$(nproc --all) CC="ccache clang" ${{ env.CUSTOM_CMDS }} ${{ env.EXTRA_CMDS }} O=out ARCH=arm64 M=wb_shim modules > shim_build.log 2>&1 || true
          tail -40 shim_build.log || true
          echo "=== WB-V38: collected ==="
          mkdir -p $GITHUB_WORKSPACE/shim_out
          find wb_shim -name '*.ko' -exec cp -v {} $GITHUB_WORKSPACE/shim_out/ \; || true
          ls -la $GITHUB_WORKSPACE/shim_out || true

      - name: Upload stackchk shim (WB-V38)
        uses: actions/upload-artifact@v4
        with:
          name: stackchk-shim
          path: ${{ github.workspace }}/shim_out/stackchk_shim.ko
          if-no-files-found: warn



      - name: Pack Process
        uses: ./.github/workflows/pack-process

      - name: Upload Artifacts
